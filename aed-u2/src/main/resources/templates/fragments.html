<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - HemoTrack'">HemoTrack</title>
    <meta name="theme-color" content="#0b0e14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Montserrat:wght@600;700;800;900&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/estilo.css(v=4)}">
</head>
<body>
<header th:fragment="topo">
    <nav class="menu">
        <a class="marca" th:href="@{/}" aria-label="HemoTrack - início"><span class="logo-selo"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M50 12C50 12 18 52 18 70c0 17.7 14.3 22 32 22s32-4.3 32-22C82 52 50 12 50 12Z" stroke="#ff2d55" stroke-width="6" stroke-linejoin="round" fill="rgba(255,45,85,0.14)"/><path d="M22 64h16l6-22 8 40 8-30 6 12h12" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Hemo<span class="marca-track">Track</span></span></a>
        <a th:href="@{/requisicoes}">Requisições</a>
        <a th:href="@{/bolsas}">Estoque</a>
        <a th:href="@{/hospitais}">Hospitais</a>
        <a th:href="@{/trechos}">Malha de rotas</a>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/demanda}">Demanda preditiva</a>
        <form class="sessao" th:if="${session.usuarioNome != null}" th:action="@{/logout}" method="post">
            <span th:text="${session.usuarioNome} + ' (' + ${session.usuarioPerfil} + ')'"></span>
            <button type="submit" class="pequeno">Sair</button>
        </form>
    </nav>
    <div class="conteudo">
        <p class="aviso sucesso" th:if="${sucesso}" th:text="${sucesso}"></p>
        <p class="aviso erro" th:if="${erro}" th:text="${erro}"></p>
    </div>
</header>
</body>
</html>
