spring.application.name=hemotrack

# ---------------------------------------------------------------------------------------------
# Banco H2 gravado em ARQUIVO, numa pasta fixa dentro da pasta do usuario do sistema:
#   Windows: C:\Users\<voce>\hemotrack-dados\hemotrack.mv.db
#   Linux/Mac: ~/hemotrack-dados/hemotrack.mv.db
# Antes o caminho era relativo (./data), e por isso dependia da pasta de onde o VS Code
# iniciava a aplicacao: rodando de outra pasta (ou de uma copia nova do projeto) o sistema
# abria um banco vazio e as contas criadas "sumiam". Agora o banco e sempre o mesmo.
# Para usar outro local, defina a variavel de ambiente HEMOTRACK_DB (ex.: C:/dados/hemotrack).
# ---------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:${HEMOTRACK_DB:${user.home}/hemotrack-dados/hemotrack}
spring.datasource.username=sa
spring.datasource.password=
# "update" so cria/ajusta as tabelas; NUNCA apaga os dados existentes.
spring.jpa.hibernate.ddl-auto=update

# Console do banco em http://localhost:8080/h2-console (so abre depois de entrar na plataforma).
# Use a mesma JDBC URL exibida no log ao iniciar a aplicacao, usuario "sa" e senha em branco.
spring.h2.console.enabled=true

# US10: verificacao automatica de validade, todo dia as 00:05 (a validade muda por dia)
hemotrack.validade.cron=0 5 0 * * *

# Carrega dados de demonstracao quando o banco esta vazio (sem hospitais). Use false para comecar
# sem dados (so os usuarios sao criados); assim a primeira requisicao recebe o identificador REQ-0001.
# Atencao: com o banco ja preenchido, mudar para false NAO apaga nada; apague a pasta hemotrack-dados
# (ou aponte HEMOTRACK_DB para outro local) para comecar do zero.
hemotrack.dados-demo=true
