<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque de Bolsas - HemoTrack</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="pagina">
    <section class="painel painel-grande">
        <div class="marca-painel">
            <span class="simbolo-marca pequeno">◢</span>
            <span>HemoTrack</span>
        </div>

        <div class="cabecalho-painel">
            <h1>Estoque de Bolsas</h1>
            <a class="botao botao-contorno" th:href="@{/bolsas/nova}">Nova Bolsa</a>
        </div>

        <div class="mensagem sucesso" th:if="${param.sucesso}">
            Bolsa cadastrada com sucesso.
        </div>

        <div class="mensagem sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="mensagem erro" th:if="${erro}" th:text="${erro}"></div>

        <div class="tabela-responsiva">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Hemocomponente</th>
                    <th>Tipo</th>
                    <th>Coleta</th>
                    <th>Validade</th>
                    <th>Estado</th>
                    <th>Ação</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="bolsa : ${bolsas}">
                    <td th:text="${bolsa.codigo}"></td>
                    <td th:text="${bolsa.hemocomponente.descricao}"></td>
                    <td th:text="${bolsa.tipoSanguineo.descricao}"></td>
                    <td th:text="${bolsa.dataColeta}"></td>
                    <td th:text="${bolsa.dataValidade}"></td>
                    <td>
                        <span th:if="${bolsa.estado.name() == 'DISPONIVEL'}"
                              class="etiqueta etiqueta-disponivel"
                              th:text="${bolsa.estado.descricao}">
                        </span>

                        <span th:if="${bolsa.estado.name() == 'RESERVADA_PARA_DESPACHO'}"
                              class="etiqueta etiqueta-reservada"
                              th:text="${bolsa.estado.descricao}">
                        </span>

                        <span th:if="${bolsa.estado.name() != 'DISPONIVEL' and bolsa.estado.name() != 'RESERVADA_PARA_DESPACHO'}"
                              class="etiqueta etiqueta-neutra"
                              th:text="${bolsa.estado.descricao}">
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/bolsas/{id}/remover(id=${bolsa.id})}"
                              method="post"
                              onsubmit="return confirm('Deseja realmente remover esta bolsa do estoque?');">
                            <button class="botao botao-remover" type="submit"
                                    title="Remover bolsa">
                                Remover
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <a class="link-voltar" th:href="@{/}">Voltar ao início</a>
    </section>
</main>
</body>
</html>
