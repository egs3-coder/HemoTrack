spring.application.name=hemotrack
# Banco H2 gravado em arquivo (pasta ./data). Troque aqui se a equipe usar outro banco.
spring.datasource.url=jdbc:h2:file:./data/hemotrack
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# US10: verificacao automatica de validade, todo dia as 00:05 (a validade muda por dia)
hemotrack.validade.cron=0 5 0 * * *
# Carrega dados de demonstracao quando o banco esta vazio. Use false para comecar sem dados
# (so os usuarios sao criados); assim a primeira requisicao recebe o identificador REQ-0001.
hemotrack.dados-demo=true
