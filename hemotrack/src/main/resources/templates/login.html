<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeca('Entrar')}"></head>
<body>
<!-- US02 - cenarios 5, 6 e 7: tela de entrada -->
<main class="conteudo login">
    <div class="marca-acesso">
        <span class="logo-selo grande"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M50 12C50 12 18 52 18 70c0 17.7 14.3 22 32 22s32-4.3 32-22C82 52 50 12 50 12Z" stroke="#ff2d55" stroke-width="6" stroke-linejoin="round" fill="rgba(255,45,85,0.14)"/><path d="M22 64h16l6-22 8 40 8-30 6 12h12" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h1 class="marca-nome">Hemo<span class="marca-track">Track</span></h1>
        <p class="marca-slogan">Gestão inteligente, rastreabilidade e distribuição de hemocomponentes.</p>
    </div>
    <p class="sub">Entre para acessar a plataforma.</p>
    <p class="aviso sucesso" th:if="${sucesso}" th:text="${sucesso}"></p>
    <p class="aviso erro" th:if="${erro}" th:text="${erro}" role="alert"></p>
    <form class="formulario" th:action="@{/login}" method="post" novalidate>
        <label>Usuário
            <input type="text" name="login" th:value="${login}" autocomplete="username"
                   th:autofocus="${login == null}" required>
        </label>
        <label>Senha
            <input type="password" name="senha" autocomplete="current-password"
                   th:autofocus="${login != null}" required>
        </label>
        <button type="submit">Entrar</button>
        <a class="link-discreto" th:href="@{/recuperar-senha}">Esqueci minha senha</a>
    </form>
    <p class="sub rodape">Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
</main>
</body>
</html>
