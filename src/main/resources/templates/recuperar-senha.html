<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeca('Esqueci minha senha')}"></head>
<body>
<!-- US02 - redefinicao de senha ("Esqueci minha senha") -->
<main class="conteudo login">
    <h1>Esqueci minha senha</h1>
    <p class="sub">Confirme o usuário e o nome completo cadastrados na conta e escolha uma nova senha.</p>
    <p class="aviso erro" th:if="${erro}" th:text="${erro}" role="alert"></p>
    <form class="formulario" th:action="@{/recuperar-senha}" method="post">
        <label>Usuário
            <input type="text" name="login" th:value="${login}" autocomplete="username" autofocus required>
        </label>
        <label>Nome completo (como foi cadastrado)
            <input type="text" name="nome" th:value="${nome}" autocomplete="name" required>
        </label>
        <label>Nova senha (mínimo de 6 caracteres)
            <input type="password" name="senha" autocomplete="new-password" required>
        </label>
        <label>Confirmar nova senha
            <input type="password" name="confirmacao" autocomplete="new-password" required>
        </label>
        <button type="submit">Redefinir senha</button>
    </form>
    <p class="sub rodape">Lembrou a senha? <a th:href="@{/login}">Entrar</a> · Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
</main>
</body>
</html>
