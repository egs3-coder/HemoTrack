<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeca('Requisições')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main class="conteudo">
    <h1>Requisições</h1>
    <div class="linha">
        <a class="botao" th:href="@{/requisicoes/nova}">Nova requisição</a>
    </div>

    <!-- Filtros e Pesquisa de Requisições -->
    <section class="secao-filtros">
        <form th:action="@{/requisicoes}" method="get" class="formulario-filtros">
            <label>Identificador
                <input type="text" name="codigo" th:value="${codigoFiltro}" placeholder="REQ-0001" aria-label="Identificador do pedido">
            </label>
            <label>Urgência
                <select name="urgencia">
                    <option value="">Todas as urgências</option>
                    <option th:each="u : ${urgencias}" th:value="${u}" th:text="${u.rotulo}"
                            th:selected="${u == urgenciaFiltro}"></option>
                </select>
            </label>
            <label>Status
                <select name="status">
                    <option value="">Todos os status</option>
                    <option th:each="s : ${statusList}" th:value="${s}" th:text="${s.rotulo}"
                            th:selected="${s == statusFiltro}"></option>
                </select>
            </label>
            <div class="acoes-filtros">
                <button type="submit">Filtrar</button>
                <a th:if="${temFiltroAtivo}" th:href="@{/requisicoes}" class="botao secundario" id="btn-limpar-filtros">Limpar filtros</a>
            </div>
        </form>

        <!-- Chips de remoção individual de filtros ativos -->
        <div class="filtros-ativos" th:if="${temFiltroAtivo}">
            <span class="legenda-filtros">Filtros ativos:</span>
            <span class="chip-filtro" th:if="${codigoFiltro != null}">
                Código: <strong th:text="${codigoFiltro}"></strong>
                <a th:href="@{/requisicoes(urgencia=${urgenciaFiltro}, status=${statusFiltro})}"
                   class="remover-filtro" title="Remover filtro de código" aria-label="Remover filtro de código">&times;</a>
            </span>
            <span class="chip-filtro" th:if="${urgenciaFiltro != null}">
                Urgência: <strong th:text="${urgenciaFiltro.rotulo}"></strong>
                <a th:href="@{/requisicoes(codigo=${codigoFiltro}, status=${statusFiltro})}"
                   class="remover-filtro" title="Remover filtro de urgência" aria-label="Remover filtro de urgência">&times;</a>
            </span>
            <span class="chip-filtro" th:if="${statusFiltro != null}">
                Status: <strong th:text="${statusFiltro.rotulo}"></strong>
                <a th:href="@{/requisicoes(codigo=${codigoFiltro}, urgencia=${urgenciaFiltro})}"
                   class="remover-filtro" title="Remover filtro de status" aria-label="Remover filtro de status">&times;</a>
            </span>
            <a th:href="@{/requisicoes}" class="link-remover-todos">Remover todos os filtros</a>
        </div>
    </section>

    <div class="rolagem">
        <table>
            <thead>
            <tr>
                <th>Identificador</th><th>Hospital</th><th>Hemocomponente</th><th>Tipo</th>
                <th>Qtd.</th><th>Urgência</th><th>Status</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${requisicoes}">
                <td th:text="${r.codigo}"></td>
                <td th:text="${r.hospital.nome}"></td>
                <td th:text="${r.hemocomponente.rotulo}"></td>
                <td th:text="${r.tipoSanguineo.rotulo}"></td>
                <td th:text="${r.quantidade}"></td>
                <td th:text="${r.urgencia.rotulo}"></td>
                <td><span class="etiqueta" th:classappend="${'st-' + r.status.name()}" th:text="${r.status.rotulo}"></span></td>
                <td><a th:href="@{/requisicoes/{id}(id=${r.id})}">Abrir</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(requisicoes)}"><td colspan="8" th:text="${temFiltroAtivo} ? 'Nenhuma requisição encontrada para os critérios selecionados.' : 'Nenhuma requisição registrada.'">Nenhuma requisição registrada.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
