<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Requisições - HemoTrack</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="pagina pagina-requisicoes">
    <section class="painel painel-grande">
        <div class="cabecalho-painel cabecalho-central">
            <h1>Requisições</h1>
            <a class="botao botao-contorno" th:href="@{/requisicoes/nova}">
                Nova Requisição
            </a>
        </div>

        <div class="mensagem sucesso" th:if="${param.sucesso}">
            Requisição cadastrada com sucesso.
        </div>

        <div class="mensagem sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="mensagem erro" th:if="${erro}" th:text="${erro}"></div>

        <div class="tabela-responsiva">
            <table class="tabela-requisicoes">
                <colgroup>
                    <col class="coluna-codigo">
                    <col class="coluna-hospital">
                    <col class="coluna-hemocomponente">
                    <col class="coluna-tipo">
                    <col class="coluna-atendimento">
                    <col class="coluna-estoque">
                    <col class="coluna-urgencia">
                    <col class="coluna-estado">
                    <col class="coluna-acoes">
                </colgroup>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Hospital</th>
                    <th>Hemocomponente</th>
                    <th>Tipo sanguíneo</th>
                    <th>Atendimento</th>
                    <th>Disponíveis</th>
                    <th>Urgência</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${resumosRequisicoes.isEmpty()}">
                    <td class="estado-vazio" colspan="9">
                        Nenhuma requisição foi cadastrada.
                    </td>
                </tr>

                <tr th:each="resumo : ${resumosRequisicoes}">
                    <td th:text="${resumo.requisicao.codigoRastreamento}"></td>
                    <td th:text="${resumo.requisicao.hospital.nome}"></td>
                    <td th:text="${resumo.requisicao.hemocomponente.descricao}"></td>
                    <td th:text="${resumo.requisicao.tipoSanguineoPaciente.descricao}"></td>
                    <td>
                        <div class="resumo-quantidade">
                            <strong th:text="|${resumo.quantidadeAlocada} de ${resumo.requisicao.quantidade}|">
                            </strong>
                            <small th:text="|${resumo.quantidadePendente} pendente(s)|"></small>
                        </div>
                    </td>
                    <td>
                        <div class="resumo-estoque">
                            <strong class="estoque-quantidade"
                                    th:classappend="${resumo.quantidadeDisponivel > 0} ? ' com-estoque' : ' sem-estoque'"
                                    th:text="${resumo.quantidadeDisponivel}">
                            </strong>
                            <small>bolsa(s) compatível(is)</small>
                        </div>
                    </td>
                    <td>
                        <span class="etiqueta urgencia-normal"
                              th:if="${resumo.requisicao.urgencia == 'NORMAL'}"
                              th:text="${resumo.requisicao.urgencia}">
                        </span>

                        <span class="etiqueta urgencia-urgente"
                              th:if="${resumo.requisicao.urgencia == 'URGENTE'}"
                              th:text="${resumo.requisicao.urgencia}">
                        </span>

                        <span class="etiqueta urgencia-emergencia"
                              th:if="${resumo.requisicao.urgencia == 'EMERGENCIA'}">
                            EMERGÊNCIA
                        </span>
                    </td>
                    <td>
                        <span class="etiqueta estado-pendente"
                              th:if="${resumo.requisicao.estado.name() == 'PENDENTE_ALOCACAO'}"
                              th:text="${resumo.requisicao.estado.descricao}">
                        </span>

                        <span class="etiqueta estado-parcial"
                              th:if="${resumo.requisicao.estado.name() == 'PARCIALMENTE_ALOCADA'}"
                              th:text="${resumo.requisicao.estado.descricao}">
                        </span>

                        <span class="etiqueta estado-alocada"
                              th:if="${resumo.requisicao.estado.name() == 'ALOCADA'}"
                              th:text="${resumo.requisicao.estado.descricao}">
                        </span>

                        <span class="etiqueta etiqueta-neutra"
                              th:if="${resumo.requisicao.estado.name() != 'PENDENTE_ALOCACAO'
                              and resumo.requisicao.estado.name() != 'PARCIALMENTE_ALOCADA'
                              and resumo.requisicao.estado.name() != 'ALOCADA'}"
                              th:text="${resumo.requisicao.estado.descricao}">
                        </span>
                    </td>
                    <td class="celula-acoes">
                        <div class="acoes-tabela">
                            <form class="formulario-alocacao"
                                  th:if="${resumo.podeAlocar}"
                                  th:action="@{/requisicoes/{id}/alocar(id=${resumo.requisicao.id})}"
                                  method="post">
                                <label class="rotulo-quantidade"
                                       th:for="|quantidade-${resumo.requisicao.id}|">
                                    Qtd.
                                </label>
                                <input class="campo-quantidade-alocacao"
                                       type="number"
                                       name="quantidadeAlocar"
                                       th:id="|quantidade-${resumo.requisicao.id}|"
                                       min="1"
                                       th:max="${resumo.quantidadeMaximaAlocacao}"
                                       value="1"
                                       required>
                                <button class="botao botao-acao" type="submit">
                                    Alocar
                                </button>
                            </form>

                            <span class="aviso-sem-estoque"
                                  th:if="${resumo.quantidadePendente > 0 and resumo.quantidadeDisponivel == 0}">
                                Sem estoque
                            </span>

                            <form th:action="@{/requisicoes/{id}/remover(id=${resumo.requisicao.id})}"
                                  method="post"
                                  onsubmit="return confirm('Deseja realmente remover esta requisição?');">
                                <button class="botao botao-remover" type="submit"
                                        title="Remover requisição">
                                    Remover
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="rodape-painel">
            <a class="link-voltar" th:href="@{/}">Voltar ao início</a>

            <div class="marca-rodape-painel">
                <span class="simbolo-marca pequeno">◢</span>
                <span>HemoTrack</span>
            </div>
        </div>
    </section>
</main>
</body>
</html>
